<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클로드 게임 리스트</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b1f7a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf8f1; --ink:#1f1d1a; --muted:#6f6a61; --line:#1f1d1a;
    --tab:#fbe38a; --row-hover:#fff6d6; --shadow:3px 3px 0 #1f1d1a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background-image:radial-gradient(#e7e1d3 1px,transparent 1px); background-size:22px 22px;
    padding:56px 16px 40px;
  }
  .board{
    position:relative; max-width:640px; margin:0 auto; background:#fff;
    border:2.5px solid var(--line); border-radius:28px 22px 30px 24px / 24px 30px 22px 28px;
    box-shadow:var(--shadow); padding:58px 22px 22px;
  }
  .tab{
    position:absolute; left:50%; top:0; transform:translate(-50%,-55%) rotate(-1deg);
    background:var(--tab); border:2.5px solid var(--line); border-radius:14px 18px 12px 16px;
    padding:10px 38px; box-shadow:var(--shadow); white-space:nowrap;
    font-family:"Gaegu",cursive; font-weight:700; font-size:28px; letter-spacing:1px; margin:0;
  }
  .sub{ text-align:center; color:var(--muted); font-size:14px; margin:0 0 14px }
  ol{ list-style:none; margin:0; padding:0 }
  li{
    display:flex; align-items:center; gap:12px; padding:10px 10px;
    border-bottom:1.5px dashed #d5cfc2; border-radius:12px; transition:background .15s;
  }
  li:last-child{ border-bottom:none }
  li:hover{ background:var(--row-hover) }
  .num{ font-family:"Gaegu",cursive; font-weight:700; font-size:22px; width:30px; text-align:right; flex:none }
  .icon{ width:40px; height:40px; border-radius:10px; border:1.5px solid var(--line); flex:none;
    background:#f3efe6 center/cover no-repeat; display:grid; place-items:center; font-size:22px; overflow:hidden }
  .icon img{ width:100%; height:100%; object-fit:cover; display:block }
  .name{ flex:1; min-width:0 }
  .name b{ display:block; font-family:"Gaegu",cursive; font-size:23px; line-height:1.1; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .name small{ display:block; color:var(--muted); font-size:12.5px; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .btns{ display:flex; flex:none; border:2px solid var(--line); border-radius:12px 10px 13px 11px;
    overflow:hidden; box-shadow:2px 2px 0 var(--line); background:#fff }
  .btns button{
    font:inherit; font-size:15px; border:0; background:transparent; color:var(--ink);
    padding:7px 13px; cursor:pointer; transition:background .15s;
  }
  .btns button + button{ border-left:2px solid var(--line) }
  .btns button:hover{ background:var(--tab) }
  .btns button:active{ transform:translateY(1px) }
  .btns button:focus-visible{ outline:3px solid #4a7cff; outline-offset:-3px }
  footer{ max-width:640px; margin:18px auto 0; text-align:center; color:var(--muted); font-size:12.5px }

  /* 규칙 창 */
  dialog{
    width:min(560px,calc(100vw - 28px)); max-height:min(80vh,760px); padding:0;
    border:2.5px solid var(--line); border-radius:22px; box-shadow:5px 5px 0 var(--line);
    background:#fff; color:var(--ink);
  }
  dialog::backdrop{ background:rgba(31,29,26,.45) }
  dialog[open]{ display:flex; flex-direction:column; animation:pop .18s ease-out }
  @keyframes pop{ from{ transform:scale(.96); opacity:0 } to{ transform:none; opacity:1 } }
  .dlg-head{ display:flex; align-items:center; gap:10px; padding:14px 18px; background:var(--tab);
    border-bottom:2px solid var(--line) }
  .dlg-head h2{ margin:0; flex:1; font-family:"Gaegu",cursive; font-size:26px; font-weight:700 }
  .x{ font:inherit; font-size:20px; width:36px; height:36px; border-radius:50%; border:2px solid var(--line);
    background:#fff; cursor:pointer; line-height:1 }
  .x:hover{ background:#fff6d6 }
  .dlg-body{ padding:6px 22px 8px; overflow:auto; line-height:1.65; font-size:15px }
  .dlg-body h3{ font-size:16px; margin:16px 0 4px; padding-left:8px; border-left:4px solid #e8c547 }
  .dlg-body ul,.dlg-body ol{ margin:4px 0; padding-left:22px }
  .dlg-body ol{ list-style:decimal } .dlg-body ul{ list-style:disc }
  .dlg-body li{ display:list-item; padding:1px 0; border:0; border-radius:0 }
  .dlg-body li:hover{ background:none }
  .dlg-body p{ margin:6px 0 }
  .dlg-foot{ display:flex; gap:10px; justify-content:flex-end; padding:12px 18px; border-top:1.5px dashed #d5cfc2 }
  .dlg-foot a, .dlg-foot button{
    font:inherit; font-size:15px; padding:8px 16px; border-radius:12px; border:2px solid var(--line);
    background:#fff; color:var(--ink); cursor:pointer; text-decoration:none; box-shadow:2px 2px 0 var(--line)
  }
  .dlg-foot .primary{ background:var(--tab) }

  @media (max-width:480px){
    body{ padding-top:48px }
    .board{ padding:50px 12px 14px }
    .tab{ font-size:24px; padding:8px 26px }
    li{ gap:8px; padding:9px 4px }
    .num{ width:22px; font-size:19px }
    .icon{ width:34px; height:34px }
    .name b{ font-size:20px }
    .name small{ display:none }
    .btns button{ padding:7px 9px; font-size:14px }
  }
</style>
</head>
<body>

<main class="board">
  <h1 class="tab">클로드 게임 리스트</h1>
  <p class="sub">클로드와 함께 만든 웹 게임 모음</p>
  <ol id="list"></ol>
</main>
<footer>‘바로가기’는 새 창으로 열려요 · 창 크기는 자유롭게 조절할 수 있어요</footer>

<dialog id="rules" aria-labelledby="rules-title">
  <div class="dlg-head">
    <h2 id="rules-title"></h2>
    <button class="x" data-close aria-label="닫기">✕</button>
  </div>
  <div class="dlg-body" id="rules-body"></div>
  <div class="dlg-foot">
    <button data-close>닫기</button>
    <button class="primary" id="rules-play">바로가기 ▶</button>
  </div>
</dialog>

<script>

   - win  : 새 창 기본 크기 [가로, 세로]

        <li>난이도에 따라 트럼프 카드 16장(상)·12장(중)·8장(하)이 한 줄에 4장씩 놓이고, <b>20초</b> 동안 앞면이 공개돼요.</li>
        <li>카드가 모두 뒤집히면 무작위 3장이 공개돼요.</li>
        <li>뒤집힌 카드 중 <b>2장</b>을 골라 공개된 3장과 합쳐 5장 패를 만들어요. 다시 누르면 선택 해제.</li>
      </ol>
      <h3>결과</h3>
      <ul>
        <li>족보가 높을수록 좋고, 같은 족보끼리는 높은 숫자가 이겨요.</li>
        <li>내 패의 순위와 최적 조합, 가능했던 족보별 개수를 보여 줘요.</li>
      </ul>`
  }
];

/* ── 목록 그리기 ── */
const list = document.getElementById("list");
GAMES.forEach((g, i) => {
  const li = document.createElement("li");
  li.innerHTML = `
    <span class="num">${i + 1}.</span>
    <span class="icon">${g.icon ? `<img src="${g.icon}" alt="" loading="lazy">` : g.emoji}</span>
    <span class="name"><b>${g.name}</b><small>${g.desc}</small></span>
    <span class="btns">
      <button type="button" data-rules="${i}">규칙</button>
      <button type="button" data-play="${i}">바로가기</button>
    </span>`;
  const img = li.querySelector("img");
  if (img) img.onerror = () => { img.parentElement.textContent = g.emoji; };
  list.appendChild(li);
});

/* ── 새 창으로 게임 열기 (메뉴바·상태바 없이, 크기 조절 가능) ── */
function openGame(g) {
  const [w0, h0] = g.win || [1100, 820];
  const sw = screen.availWidth, sh = screen.availHeight;
  const w = Math.min(w0, sw - 40), h = Math.min(h0, sh - 60);
  const left = (screen.availLeft || 0) + Math.max(0, (sw - w) / 2);
  const top  = (screen.availTop  || 0) + Math.max(0, (sh - h) / 2);
  const features = [
    "popup=yes", `width=${w}`, `height=${h}`, `left=${left}`, `top=${top}`,
    "menubar=no", "toolbar=no", "location=no", "status=no", "personalbar=no",
    "resizable=yes", "scrollbars=yes"
  ].join(",");
  const win = window.open(g.url, "game_" + g.name.replace(/\W/g, ""), features);
  if (win) win.focus();
  else location.href = g.url; // 팝업이 막힌 경우 현재 창에서 열기
}

/* ── 규칙 창 ── */
const dlg = document.getElementById("rules");
let current = null;
function showRules(g) {
  current = g;
  document.getElementById("rules-title").textContent = g.name + " 규칙";
  const body = document.getElementById("rules-body");
  body.innerHTML = g.rules;
  body.scrollTop = 0;
  dlg.showModal();
}
document.getElementById("rules-play").onclick = () => { dlg.close(); if (current) openGame(current); };
dlg.addEventListener("click", e => {
  if (e.target.closest("[data-close]") || e.target === dlg) dlg.close(); // 바깥 클릭으로도 닫기
});

list.addEventListener("click", e => {
  const r = e.target.closest("[data-rules]"), p = e.target.closest("[data-play]");
  if (r) showRules(GAMES[r.dataset.rules]);
  if (p) openGame(GAMES[p.dataset.play]);
});
</script>
</body>
</html>
